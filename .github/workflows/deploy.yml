name: CI/CD Deployment Pipeline

on:
  push:
    branches:
      - main
      - uat
  pull_request:
    branches:
      - main

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  validate-and-deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Static Code Analysis & Syntax Validation
        run: |
          echo "Running syntax validation..."
          node --check app.js
          node --check sw.js
          node --input-type=module -e "import('./functions/api/submit-bhajan.js')"
          node --input-type=module -e "import('./functions/api/bhajans.js')"
          node --input-type=module -e "import('./functions/api/report.js')"
          # index.html must load style.css / data.js / app.js with ?v=<sw.js cache version>, so browsers
          # never pair a new page with an old cached script (bhajanhits.com caches JS/CSS for hours).
          V=$(grep -o "bbs-static-v[0-9]*" sw.js | head -1 | grep -o "[0-9]*$")
          for f in style.css data.js app.js; do
            grep -q "$f?v=$V\"" index.html || { echo "index.html must reference $f?v=$V to match sw.js (bbs-static-v$V)"; exit 1; }
          done
          if grep -q "CONTACT_EMAIL_TO_BE_ADDED" copyright.html; then echo "copyright.html still has the contact email placeholder"; exit 1; fi
          echo "All syntax and module checks passed."

      - name: Determine Target Environment & Branch Flag
        id: env-config
        run: |
          if [ "${{ github.ref_name }}" = "main" ] && [ "${{ github.event_name }}" = "push" ]; then
            echo "is_production=true" >> $GITHUB_OUTPUT
            echo "branch_name=main" >> $GITHUB_OUTPUT
            echo "env_name=Production" >> $GITHUB_OUTPUT
          else
            echo "is_production=false" >> $GITHUB_OUTPUT
            echo "branch_name=${{ github.head_ref || github.ref_name }}" >> $GITHUB_OUTPUT
            echo "env_name=UAT / Preview" >> $GITHUB_OUTPUT
          fi

      # Publish only the website's own files, so notes such as README.md and the handoff document
      # stay in GitHub and are not served on the public site. The functions/ folder is picked up
      # from the repository root by wrangler, so Pages Functions keep working.
      - name: Collect public site files
        run: |
          mkdir -p site
          cp index.html copyright.html style.css app.js data.js sw.js manifest.json icon.svg icon-192.png icon-512.png site/
          ls -la site

      - name: Deploy to Cloudflare Pages
        id: cloudflare-deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            pages deploy site
            --project-name=bhakti-bhajan-sangrah 
            --branch=${{ steps.env-config.outputs.branch_name }} 
            --commit-dirty=true

      - name: Output Deployment Summary
        run: |
          echo "=========================================="
          echo "Deployment Target : ${{ steps.env-config.outputs.env_name }}"
          echo "Branch Tagged     : ${{ steps.env-config.outputs.branch_name }}"
          echo "Project           : bhakti-bhajan-sangrah"
          echo "=========================================="
